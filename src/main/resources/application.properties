spring.application.name=game-expert

# .env 파일 불러오기
spring.config.import=optional:file:.env[.properties]

# MySQL 연결 설정
spring.datasource.url=jdbc:mysql://localhost:3307/${MYSQL_DATABASE}
spring.datasource.username=${MYSQL_USER}
spring.datasource.password=${MYSQL_PASSWORD}

# JPA 설정
spring.jpa.hibernate.ddl-auto=update

# Redis 연결 설정
spring.data.redis.host=localhost
spring.data.redis.port=6379


# ===== Spring 기본 설정 =====
# spring.application.name: Spring 애플리케이션의 이름을 지정합니다.
# spring.config.import: 프로젝트 최상위 경로의 .env 파일을 불러옵니다.
# optional: .env 파일이 없어도 애플리케이션 실행을 시도합니다.


# ===== MySQL 설정 =====
# spring.datasource.url: MySQL의 접속 주소, Port, Database 이름을 지정합니다.
# localhost:3307: Docker에서 실행 중인 MySQL에 접속합니다.
# ${MYSQL_DATABASE}: .env 파일에서 Database 이름을 가져옵니다.
# spring.datasource.username: MySQL에 접속할 사용자 이름을 지정합니다.
# spring.datasource.password: MySQL에 접속할 사용자 비밀번호를 지정합니다.


# ===== JPA 설정 =====
# spring.jpa.hibernate.ddl-auto=update: Entity 정의를 기준으로 Database의 Table 구조를 자동 갱신합니다.
# 기존 데이터를 유지하면서 Schema 변경을 시도하지만, 모든 변경을 자동으로 처리하지는 않습니다.


# ===== Redis 설정 =====
# spring.data.redis.host: Redis 서버의 접속 주소를 지정합니다.
# spring.data.redis.port: Redis 서버에 접속할 Port를 지정합니다.
# localhost: 현재 PC에서 실행 중인 Docker의 Redis에 접근합니다.
# 6379: Redis의 기본 Port입니다.